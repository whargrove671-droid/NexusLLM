[workspace]
resolver = "2"
members = [
    "crates/nexus-agent",
    "crates/nexus-executor",
    "crates/nexus-tee",
    "crates/nexus-p2p",
    "crates/nexus-scheduler",
    "crates/nexus-registry",
    "crates/nexus-settlement",
    "crates/nexus-proto",
    "crates/nexus-common",
]
exclude = []

[workspace.dependencies]
# Core
tokio = { version = "1.38", features = ["full", "rt-multi-thread", "macros", "sync"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1.5"
futures = "0.3"
tracing = { version = "0.1", features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_bytes = "0.11"
uuid = { version = "1.6", features = ["v4", "serde", "fast-rng"] }
parking_lot = "0.12"
dashmap = "5.5"
crossbeam = "0.8"

# Crypto & Identity
ed25519-dalek = "2.1"
x25519-dalek = "2.0"
rand = { version = "0.8", features = ["std", "getrandom"] }
ring = "0.17"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
k256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
sha2 = "0.10"
blake3 = "1.5"
zeroize = { version = "1.3", features = ["zeroize_derive"] }
secret-integers = "0.3"

# TEE
sgx-types = { version = "1.1", package = "sgx_types" }
sgx-urts = { version = "1.1", package = "sgx_urts" }
# sev-rs = { version = "0.1", optional = true }  # When available

# P2P / Networking
libp2p = { version = "0.54", features = [
    "tcp", "websocket", "noise", "yamux",
    "kad", "gossipsub", "identify", "ping", "relay", "dcutr"
] }
# libp2p-webRTC = { version = "0.53", features = ["webrtc"], optional = true }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
quinn = { version = "0.10", features = ["rustls", "ring"] }
rustls = { version = "0.23", features = ["std", "tls12"] }
rcgen = "0.11"

# Model Execution
candle-core = { version = "0.8" }
candle-nn = { version = "0.8" }
candle-transformers = { version = "0.8" }
tokenizers = "0.15"
hf-hub = { version = "0.5", features = ["rustls-tls"] }
safetensors = "0.5"
ggml-sys = { version = "0.1" }  # For llama.cpp backend
ort = { version = "1.16", features = ["cpu"] }  # ONNX Runtime

# Metrics & Observability
metrics = "0.22"
metrics-exporter-prometheus = "0.13"
opentelemetry = { version = "0.27", features = ["trace", "metrics"] }
opentelemetry-otlp = { version = "0.33", features = ["tonic", "trace"] }
opentelemetry-prometheus = "0.27"
tracing-opentelemetry = "0.27"

# Config
config = "0.14"
figment = { version = "0.10", features = ["toml", "env", "json", "yaml"] }
clap = { version = "4.5", features = ["derive", "env", "string", "help", "usage"] }

# Async utils
async-trait = "0.1"
async-stream = "0.3"
tokio-stream = "0.1"
stream-cancel = "0.2"

# Serialization
prost = "0.12"
prost-types = "0.12"
tonic = { version = "0.11", features = ["tls", "transport", "codegen"] }
tonic-build = "0.11"
prost-build = "0.12"

# Testing
tokio-test = "0.4"
proptest = "1.1"
mockall = { version = "0.12", features = ["nightly"] }
tempfile = "3.8"
wiremock = "0.5"

# Platform-specific (for target-specific dependencies)
libc = "0.2"
nix = { version = "0.27", features = ["process", "fs"] }

[workspace.lints.rust]
unused_crate_dependencies = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"
variant_size_differences = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
cargo = "warn"
perf = "warn"
module_name_repetitions = "allow"
type_complexity = "allow"
too_many_arguments = "allow"
needless_pass_by_value = "allow"
enum_glob_use = "allow"
wildcard_enum_match_arm = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
must_use_candidate = "allow"
similar_names = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.bench]
inherits = "release"
debug = true