[package]
name = "nexus-agent"
version = "0.1.0"
edition = "2021"
description = "NexusLLM Worker Agent"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nexusllm/nexusllm"
categories = ["network-programming", "command-line-utilities", "wasm"]
keywords = ["llm", "distributed", "inference", "p2p"]

[dependencies]
nexus-common = { path = "../nexus-common" }
nexus-executor = { path = "../nexus-executor" }
nexus-p2p = { path = "../nexus-p2p" }
nexus-proto = { path = "../nexus-proto" }
nexus-tee = { path = "../nexus-tee" }
nexus-scheduler = { path = "../nexus-scheduler" }

tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
uuid = { workspace = true }
parking_lot = { workspace = true }
dashmap = { workspace = true }

clap = { workspace = true }
figment = { workspace = true }
config = { workspace = true }

async-trait = { workspace = true }
tokio-stream = { workspace = true }

metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry-otlp = { workspace = true }
tracing-opentelemetry = { workspace = true }

[dev-dependencies]
tokio-test = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }
wiremock = { workspace = true }

[[bin]]
name = "nexus-agent"
path = "src/main.rs"