[package]
name = "nexus-executor"
version = "0.1.0"
edition = "2021"
description = "Shard Executor trait and backends for NexusLLM"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nexusllm/nexusllm"

[dependencies]
nexus-common = { path = "../nexus-common" }
nexus-proto = { path = "../nexus-proto" }

tokio = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
candle-core = { workspace = true }
candle-nn = { workspace = true }
candle-transformers = { workspace = true }
tokenizers = { workspace = true }
safetensors = { workspace = true }
tracing = { workspace = true }

# Optional backends
cudarc = { version = "0.5", optional = true }
ggml-sys = { workspace = true, optional = true }

[features]
default = []
cuda = ["cudarc"]
rocm = []
llama-cpp = ["ggml-sys"]