[package]
name = "nexus-tee"
version = "0.1.0"
edition = "2021"
description = "TEE abstraction layer for NexusLLM (SGX, SEV, TrustZone, Secure Enclave)"
license = "LicenseRef-NexusLLM-1.0"
repository = "https://github.com/whargrove671-droid/NexusLLM"

[dependencies]
nexus-common = { path = "../nexus-common" }
nexus-proto = { path = "../nexus-proto" }

tokio = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
tracing = { workspace = true }
zeroize = { workspace = true }

# Platform-specific TEE libraries
# NOTE: `sgx-types` / `sgx-urts` (1.1) are unmaintained (2019) and will not
# compile on modern Rust.  When implementing real SGX support, prefer one of:
#   - fortanix-sgx-abi / fortanix-sgx-sdk
#   - intel-sgx-abi / the official Intel sgx-sdk Rust wrappers
#   - A pure-quote / DCAP interface behind an FFI boundary
# Stubs are left here so the crate compiles on non-SGX targets with `--no-default-features`.
sgx-types = { version = "1.1", package = "sgx_types", optional = true }
sgx-urts = { version = "1.1", package = "sgx_urts", optional = true }
# sev-rs = { version = "0.1", optional = true }  # unblock when crate is published

[features]
default = []
sgx = ["sgx-types", "sgx-urts"]
sev = []  # sev-rs when available
trustzone = []
secure-enclave = []

[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }
nix = { workspace = true, features = ["process", "fs"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = { version = "0.9" }
core-foundation-sys = { version = "0.8" }
security-framework = { version = "2.9", features = ["OSX_10_15"] }
metal = { version = "0.27", features = ["dispatch", "link", "mps"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation", "Win32_System_Threading", "Win32_System_Memory",
    "Win32_System_JobObjects", "Win32_Security_Cryptography",
    "Win32_System_Power", "Win32_UI_WindowsAndMessaging"
] }