[package]
name = "nexus-common"
version = "0.1.0"
edition = "2021"
description = "Shared types and utilities for NexusLLM"
license = "LicenseRef-NexusLLM-1.0"
repository = "https://github.com/whargrove671-droid/NexusLLM"

[dependencies]
nexus-proto = { path = "../nexus-proto" }

tokio = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
